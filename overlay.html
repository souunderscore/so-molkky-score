<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SÖ OBSオーバーレイ</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
  overflow: hidden;
}

.overlay { padding: 10px; min-width: 300px; }

/* ─── ゲームタイトルバー (A: オレンジ縦線+白背景) ─── */
.game-title-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
  padding: 10px 14px 10px 18px;
  background: #F0F2F6;
  border-radius: 8px;
  border-left: 5px solid #FF5500;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}
.game-title-name {
  font-size: 16px;
  font-weight: 900;
  color: #14191F;
  letter-spacing: 0.04em;
}
.game-title-reg {
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(90deg, #FF5500, #FF7733);
  padding: 3px 10px;
  border-radius: 12px;
  letter-spacing: 0.04em;
  white-space: nowrap;
  flex-shrink: 0;
}

/* ─── グリッド ─── */
.teams-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.teams-grid.count-5,
.teams-grid.count-6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 480px) {
  .teams-grid.count-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ─── チームカード（白ベース） ─── */
.team-card {
  background: #ffffff;
  border-radius: 14px;
  border: 2px solid #D8DDE4;
  overflow: hidden;
  transition: all 0.2s ease;
}

.team-card.active {
  border-width: 3px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.18);
}

.team-card.inactive {
  border-color: #D0D7DF;
}

.team-card.eliminated {
  opacity: 0.35;
  filter: grayscale(0.7);
}

/* ─── ヘッダーバー ─── */
.card-header {
  padding: 9px 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  min-height: 38px;
}

/* アクティブ: チームカラー背景 */
.card-header.active-header {
  /* background は JS でインライン設定 */
}

/* 非アクティブ: グレー */
.card-header.inactive-header {
  background: #E4E9EF;
}

.team-heading {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px;
  min-width: 0;
}

.team-name {
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.01em;
}

.active-badge {
  font-size: 11px;
  font-weight: 800;
  background: rgba(255,255,255,0.28);
  color: #fff;
  padding: 2px 9px;
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
  letter-spacing: 0.02em;
}

/* ─── カード本体 ─── */
.card-body {
  padding: 10px 14px 11px;
}

/* ─── スコア ─── */
.score {
  font-size: 50px;
  font-weight: 900;
  text-align: center;
  line-height: 1;
  margin: 2px 0 8px;
  letter-spacing: -0.02em;
}

/* ─── プログレスバー ─── */
.progress-wrap {
  height: 5px;
  background: #EDF0F4;
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 8px;
}
.progress-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.5s ease;
}

/* ─── ミスドット ─── */
.miss-row {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 5px;
}
.miss-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #DDE2E8;
}
.miss-dot.hit { background: #EF4444; }

/* ─── 試合終了時のコンパクトグリッド ─── */
.compact-grid .score { font-size: 30px !important; margin: 1px 0 4px !important; }
.compact-grid .score-body { padding: 4px 10px 6px !important; }

/* ─── 試合終了バナー（コンパクト横带） ─── */
.finished-banner {
  border-radius: 10px;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  /* background は JS でインライン設定 */
}
.finished-banner .trophy { font-size: 18px; flex-shrink: 0; }
.finished-banner .winner-label {
  font-size: 13px; color: rgba(255,255,255,0.90);
  font-weight: 800;
  letter-spacing: 0.05em;
  line-height: 1.2;
}
.finished-banner .winner-name {
  font-size: 15px; font-weight: 900; color: #fff; line-height: 1.2;
}

/* ─── カード内の直近の投擲 ─── */
.card-throws {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  min-height: 20px;
}
.throw-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 21px;
  min-height: 20px;
  padding: 1px 4px;
  border: 1px solid var(--throw-border);
  border-radius: 20px;
  color: var(--throw-color);
  font-size: 10px;
  font-weight: 800;
  line-height: 1.2;
  white-space: nowrap;
}
.throw-chip.latest { background: var(--throw-fill); }
.throw-chip.miss-chip {
  --throw-color: #DC2626;
  --throw-border: #FECACA;
  --throw-fill: #FEE2E2;
}
.throw-chip.burst-chip {
  --throw-color: #92400E;
  --throw-border: #FCD34D;
  --throw-fill: #FEF3C7;
}

/* ─── 待機中 ─── */
.no-game {
  padding: 14px 18px; text-align: center;
  color: rgba(255,255,255,0.55); font-size: 12px;
  background: rgba(0,0,0,0.45); border-radius: 12px;
  backdrop-filter: blur(6px);
}
</style>
<link rel="apple-touch-icon" sizes="180x180" href="icons/overlay-apple-touch-icon.png?v=20261030-blue">
<link rel="icon" type="image/png" sizes="192x192" href="icons/overlay-icon-192.png?v=20261030-blue">
</head>
<body>
<div class="overlay" id="overlay"></div>

<!-- Firebase SDK (compat版) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
// チーム1=オレンジ、チーム2=青、〃3以降はバランスよく
const TEAM_COLORS = ['#FF5500','#2B9DC8','#9B59B6','#27AE60','#E67E22','#E74C3C'];
const STORAGE_KEY = 'molkky_live_state';
let lastStateStr = null;

function getState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw).data || null;
  } catch(e) { return null; }
}

function render(state) {
  const el = document.getElementById('overlay');

  if (!state || state.phase === 'setup') {
    el.innerHTML = `<div class="no-game">試合待機中...</div>`;
    return;
  }

  // レギュレーションラベル生成
  const rm = state.regMode || 'match';
  const rn = state.regN || 2;
  const regLabel = rm === 'eleven' ? `11先${state.elevenExtended ? ' · 延長（2勝差）' : ''}` : rm === 'prime' ? `プライム${state.primeExtended ? ' · ' + (state.currentSet || 1) + '/8セット' : ''}` : rm === 'uniform' ? `${state.finalTargetScore || rn*50}点均一 · ${state.currentSet || 1}セット目` : rm === 'first' ? `${rn}セット先取` : rm === 'total' ? `${rn}セット合計` : `${rn}セット勝負`;
  // 大会名がなくてもレギュ名は常に表示
  const titleHtml = `<div class="game-title-bar">
    ${state.gameName ? `<span class="game-title-name">${esc(state.gameName)}</span>` : ''}
    <span class="game-title-reg">${regLabel}</span>
  </div>`;

  if (state.phase === 'finished') {
    const winner = state.teams.find(t => t.id === state.winnerId);
    const winColor = winner
      ? TEAM_COLORS[(winner.colorIdx !== undefined ? winner.colorIdx : state.teams.indexOf(winner)) % TEAM_COLORS.length]
      : '#FF5500';
    el.innerHTML = `
      ${titleHtml}
      <div class="finished-banner" style="background:linear-gradient(135deg,${winColor},${darken(winColor)});">
        <div class="trophy">🏆</div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="winner-label">勝者</span>
          <span class="winner-name">${esc(winner ? winner.name : '引き分け')}</span>
        </div>
      </div>
      <div class="compact-grid">${buildTeamsGrid(state)}</div>
      ${buildSetAnalysis(state)}
    `;
    return;
  }

  el.innerHTML = `${titleHtml}${buildTeamsGrid(state)}`;
}

function buildTeamsGrid(state) {
  const count = state.teams.length;
  const curId = state.teams[state.currentTeamIdx]?.id;
  const activeCount = state.teams.filter(t => !t.isEliminated).length;
  const turnNum = Math.floor((state.turnCount || 0) / Math.max(1, activeCount)) + 1;
  const burstReset = state.regMode === 'uniform' ? state.targetScore - 25 : 25;

  const cards = state.teams.map((t, i) => {
    const isActive = t.id === curId && state.phase === 'playing' && !t.isEliminated;
    const cls = t.isEliminated ? 'eliminated' : isActive ? 'active' : 'inactive';
    const color = TEAM_COLORS[(t.colorIdx !== undefined ? t.colorIdx : i) % TEAM_COLORS.length];
    const pct = Math.min(100, Math.round((t.score / state.targetScore) * 100));

    // ヘッダー: アクティブ=チームカラー背景・白文字、非アクティブ=グレー背景・ダーク文字
    const headerBg    = isActive ? color : '#E4E9EF';
    const headerCls   = isActive ? 'active-header' : 'inactive-header';
    const nameColor   = isActive ? '#fff' : '#4A5568';
    const badgeHtml   = isActive
      ? `<span class="active-badge">ターン ${turnNum}</span>` : '';

    // スコア: 両方チームカラーで同じ濃さ
    const scoreColor  = t.isEliminated ? '#94A3B8' : color;
    const scoreDisp   = t.isEliminated ? '❌' : t.score;

    const missDots = Array.from({ length: state.maxMiss || 3 }, (_, mi) =>
      `<div class="miss-dot ${mi < (t.missStreak || 0) ? 'hit' : ''}"></div>`
    ).join('');

    // 旧バージョンで保存された試合では従来の共有履歴を使う
    const recentThrows = (t.recentThrows ?? (state.recentThrows || []).filter(h => h.teamIdx === i)).slice(-3);
    const throwChips = recentThrows.map((h, index) => {
      const latest = index === recentThrows.length - 1 ? ' latest' : '';
      if (h.points === 0) {
        return `<span class="throw-chip miss-chip${latest}" title="ミス">×</span>`;
      }
      if (h.burst) {
        const resetScore = Number.isFinite(h.scoreAfter) ? h.scoreAfter : burstReset;
        return `<span class="throw-chip burst-chip${latest}" title="バースト">${esc(h.points)}→${resetScore}</span>`;
      }
      return `<span class="throw-chip${latest}">${esc(h.points)}</span>`;
    }).join('');

    // カードのborder色
    const borderStyle = isActive
      ? `border-color:${color};`
      : `border-color:#D0D7DF;`;

    const setWins = t.setWins || 0;
    const setTotalScore = t.setTotalScore || 0;
    const hasSets = (state.teams.some(tm => (tm.setWins || 0) > 0 || (tm.setTotalScore || 0) > 0));
    const setWinBadge = hasSets
      ? `<span style="font-size:10px;font-weight:700;color:${isActive ? '#fff' : color};margin-left:4px;">${setWins}勝</span>`
      : '';
    const totalBadge = hasSets
      ? `<span style="font-size:9px;font-weight:700;color:${isActive?'rgba(255,255,255,0.8)':'#6b7280'};margin-left:4px;">計${setTotalScore}</span>`
      : '';

    return `
      <div class="team-card ${cls}" style="${borderStyle}"${isActive ? ' aria-current="true"' : ''}>
        <div class="card-header ${headerCls}" style="background:${headerBg};">
          <span class="team-heading">
            <span class="team-name" style="color:${nameColor};">${esc(t.name)}</span>
            ${setWinBadge}
            ${totalBadge}
          </span>
          ${badgeHtml}
        </div>
        <div class="card-body">
          <div class="score" style="color:${scoreColor};">${scoreDisp}</div>
          <div class="progress-wrap">
            <div class="progress-fill" style="width:${pct}%;background:${color};"></div>
          </div>
          <div class="miss-row">${missDots}</div>
          <div class="card-throws" style="--throw-color:${color};--throw-border:${color}60;--throw-fill:${color}20;"${throwChips ? ' role="group" aria-label="直近の投擲"' : ''}>${throwChips}</div>
        </div>
      </div>`;
  });

  return `<div class="teams-grid count-${count}">${cards.join('')}</div>`;
}

// ─── 試合全体分析（試合終了時）───
function buildSetAnalysis(state) {
  const setResults = state.setResults || [];
  if (setResults.length === 0) return '';

  // 全セットの投擲をチームごとに集計
  const teamMap = {}; // teamId → { teamName, colorIdx, throws[] }
  setResults.forEach(sr => {
    (sr.scores || []).forEach(sc => {
      if (!teamMap[sc.teamId]) {
        teamMap[sc.teamId] = { teamName: sc.teamName || '', colorIdx: 0, throws: [] };
        const t = state.teams.find(t2 => t2.id === sc.teamId);
        if (t) teamMap[sc.teamId].colorIdx = t.colorIdx !== undefined ? t.colorIdx : t.id;
      }
      teamMap[sc.teamId].throws.push(...(sc.throws || []));
    });
  });

  // 試合全体のタイムスタンプで時間を計算
  const allTs = Object.values(teamMap).flatMap(d => d.throws.map(h => h.timestamp).filter(Boolean));
  const durStr = allTs.length >= 2
    ? (() => { const s = Math.round((Math.max(...allTs) - Math.min(...allTs)) / 1000); return s >= 60 ? `${Math.floor(s/60)}分${s%60}秒` : `${s}秒`; })()
    : null;

  // ターン数：全セットの投擲数の最大値（チーム数で割る）
  const teamCount = Object.keys(teamMap).length || 1;
  const totalThrows = Math.max(...Object.values(teamMap).map(d => d.throws.length), 0);
  const totalTurns = Math.ceil(totalThrows / teamCount) || 0;

  // チーム統計行
  const statRows = Object.entries(teamMap).map(([tid, data]) => {
    const color = TEAM_COLORS[data.colorIdx % TEAM_COLORS.length];
    const throws = data.throws;
    const total = throws.length;
    const intendedCount = throws.filter(h => h.intended !== false).length;
    const missCount = throws.filter(h => h.points === 0).length;
    const intendedRate = total > 0 ? Math.round(intendedCount / total * 100) + '%' : '-';
    const missAvoidRate = total > 0 ? Math.round((total - missCount) / total * 100) + '%' : '-';
    const isWinner = state.winnerId == tid;

    return `
      <tr style="border-bottom:1px solid #f0f4f8;">
        <td style="padding:4px 6px;">
          <span style="display:inline-flex;align-items:center;gap:4px;">
            <span style="width:6px;height:6px;border-radius:50%;background:${color};display:inline-block;"></span>
            <span style="font-weight:800;font-size:10px;color:${color};">${esc(data.teamName)}</span>
            ${isWinner ? '<span style="font-size:8px;background:#FFF0E8;color:#FF5500;padding:1px 4px;border-radius:5px;font-weight:800;">勝者</span>' : ''}
          </span>
        </td>
        <td style="text-align:center;font-size:10px;">${total}投</td>
        <td style="text-align:center;font-size:10px;font-weight:700;color:${intendedCount/total>=0.7?'#16A34A':'#374151'}">${intendedRate}</td>
        <td style="text-align:center;font-size:10px;font-weight:700;color:${(total-missCount)/total>=0.7?'#16A34A':'#374151'}">${missAvoidRate}</td>
      </tr>`;
  }).join('');

  return `
    <div style="background:#fff;border-radius:8px;margin-top:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.15);border-left:4px solid #FF5500;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:#FFF8F5;border-bottom:1px solid #FFE8D6;">
        <span style="font-size:11px;font-weight:900;color:#14191F;">試合分析</span>
        <span style="font-size:9px;color:#6b7280;">${durStr ? '⏱ ' + durStr + ' · ' : ''}全${totalTurns}ターン · ${setResults.length}セット</span>
      </div>
      <table style="width:100%;border-collapse:collapse;">
        <thead><tr style="background:#FFF8F5;">
          <th style="padding:3px 6px;font-size:9px;text-align:left;color:#9CA3AF;">チーム</th>
          <th style="text-align:center;font-size:9px;color:#9CA3AF;">投擲数</th>
          <th style="text-align:center;font-size:9px;color:#9CA3AF;">狙い通り率</th>
          <th style="text-align:center;font-size:9px;color:#9CA3AF;">ミス回避率</th>
        </tr></thead>
        <tbody>${statRows}</tbody>
      </table>
    </div>`;
}

// カラーを少し暗くする（グラデ用）
function darken(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const f = 0.75;
  return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 配信対象の公開フィールドと、選択した試合の表示だけを購読する。
const firebaseConfig = {databaseURL:'https://so-molkky-score-default-rtdb.asia-southeast1.firebasedatabase.app/'};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let displayHidden=false,selected=null,viewRef=null,lastView=null;
function paint(){if(displayHidden){document.getElementById('overlay').replaceChildren();return;}render(lastView);}
db.ref('stream_v1/control/hidden').on('value',snapshot=>{displayHidden=snapshot.val()===true;paint();});
db.ref('stream_v1/control/selectedLink').on('value',snapshot=>{
  const id=snapshot.val();if(id===selected)return;
  if(viewRef)viewRef.off();selected=id;lastView=null;paint();
  if(!id)return;
  const expected=id;viewRef=db.ref('stream_v1/rooms/'+id+'/current/viewJson');
  viewRef.on('value',snapshot=>{if(selected!==expected)return;const raw=snapshot.val();try{lastView=raw?JSON.parse(raw):null;paint();}catch{}},()=>{/* 通信断では直前の表示を維持 */});
});
// 従来のgame、BroadcastChannel、localStorageから配信を更新しない。
render(null);
</script>
</body>
</html>
