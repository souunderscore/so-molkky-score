  return `<div class="throw-timer" aria-label="投擲タイマー">
    <div class="throw-timer-readout"><span class="throw-timer-label">⏱ 投擲時間</span><output id="throw-timer-value" class="throw-timer-value" aria-label="経過時間">${throwTimerText()}</output></div>
    <button type="button" id="throw-timer-toggle" class="btn ${throwTimer.startedAt===null?'btn-blue':'btn-orange'}" onclick="toggleThrowTimer()">${throwTimerButtonLabel()}</button>
    <button type="button" class="btn btn-gray throw-timer-reset" onclick="resetThrowTimer()">リセット</button>
  </div>`;
}
function updateThrowTimerDisplay() {
  const output=document.getElementById('throw-timer-value');
  if(output){const text=throwTimerText();output.textContent=text;output.classList.toggle('throw-timer-long',text.length>7);}
}
function syncThrowTimer() {
  updateThrowTimerDisplay();
  const button=document.getElementById('throw-timer-toggle');
  if(button){
    const running=throwTimer.startedAt!==null;
    button.textContent=throwTimerButtonLabel();
    button.classList.toggle('btn-blue',!running);button.classList.toggle('btn-orange',running);
  }
  if(throwTimerInterval!==null)clearInterval(throwTimerInterval);
  throwTimerInterval=null;
  if(button&&throwTimer.startedAt!==null) throwTimerInterval=setInterval(updateThrowTimerDisplay,100);
}

// ─── スコアボードタブ ────────────────────────────────────────────
function buildScoreboardTab() {
  if (S.phase === 'setup' && S.teams.length === 0) {
    return `<div style="text-align:center;padding:40px 20px;color:#6b7280;">
      <div style="font-size:48px;margin-bottom:12px;">📊</div>
      <div style="font-size:16px;font-weight:600;">試合を開始するとスコアが表示されます</div>
    </div>`;
  }

  const teams = S.teams.length > 0 ? S.teams : [];
  const sorted = [...teams].sort((a,b) => {
    if (a.isEliminated !== b.isEliminated) return a.isEliminated ? 1 : -1;
    return b.score - a.score;
  });

  let rows = sorted.map((t, i) => {
    const isActive = t.id === S.teams[S.currentTeamIdx]?.id && S.phase === 'playing' && !t.isEliminated;
    const pct = Math.min(100, Math.round(t.score / S.settings.targetScore * 100));
    const ci = (t.colorIdx !== undefined ? t.colorIdx : teams.indexOf(t));
    return `
      <div style="padding:14px 16px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:12px;${isActive?'background:#f0fdf8;':''}${t.isEliminated?'opacity:0.4;':''}">
        <div style="font-size:22px;width:32px;text-align:center;">${i===0&&!t.isEliminated?'🥇':i===1&&!t.isEliminated?'🥈':i===2&&!t.isEliminated?'🥉':i+1}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:15px;color:${COLORS[ci%COLORS.length]};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(t.name)}</div>
          <div style="height:6px;background:#e5e7eb;border-radius:3px;margin-top:5px;">
            <div style="height:100%;background:${COLORS[ci%COLORS.length]};border-radius:3px;width:${pct}%;transition:width 0.4s;"></div>
          </div>
          <div style="font-size:11px;color:#6b7280;margin-top:3px;">${t.history.length}投 / ミス${t.missStreak}/${S.settings.maxMiss}</div>
        </div>
        <div style="font-size:42px;font-weight:900;color:${COLORS[ci%COLORS.length]};min-width:60px;text-align:right;">${t.isEliminated?'❌':t.score}</div>
      </div>`;
  }).join('');

  const phase = S.phase === 'playing' ? `<span class="live-badge">● LIVE</span>` :
                S.phase === 'finished' ? `<span style="background:#6b7280;color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;">終了</span>` : '';

  return `
    <div class="card">
      <div class="card-header">
        <span class="card-title">📊 ${escHtml(S.settings.gameName || '試合')}</span>
        <span style="margin-left:auto;">${phase}</span>
      </div>
      ${rows || '<div style="padding:20px;text-align:center;color:#6b7280;">チームなし</div>'}
    </div>
    ${S.phase === 'playing' ? `<div style="text-align:center;font-size:13px;color:#6b7280;margin-bottom:8px;">ターン ${Math.floor(S.turnCount / Math.max(1, S.teams.filter(t=>!t.isEliminated).length)) + 1} / 現在: ${escHtml(S.teams[S.currentTeamIdx]?.name||'')}</div>` : ''}
  `;
}

// ─── 履歴タブ ────────────────────────────────────────────────────
function toggleHistoryDetail(gameId) {
  if (_expandedHistory.has(gameId)) {
    _expandedHistory.delete(gameId);
  } else {
    _expandedHistory.add(gameId);
  }
  render();
}

function buildHistoryTab() {
  if (S.history.length === 0) {
    return `<div style="text-align:center;padding:40px 20px;color:#6b7280;">
      <div style="font-size:48px;margin-bottom:12px;">📋</div>
      <div style="font-size:16px;font-weight:600;">試合が終了すると履歴が表示されます</div>
    </div>`;
  }

  const cards = S.history.map((g, gi) => {
    const gameId = g.id || gi;
    const winner = g.teams.find(t => t.id === g.winnerId);
    const isExpanded = _expandedHistory.has(gameId);
    const dur = g.finishedAt && g.startedAt
      ? Math.round((g.finishedAt - g.startedAt) / 60000) + '分'
      : '';
    const dt = new Date(g.startedAt);
    const dtStr = `${dt.getMonth()+1}/${dt.getDate()} ${dt.getHours()}:${String(dt.getMinutes()).padStart(2,'0')}`;
    const setResults = g.setResults || [];
    const totalSets = setResults.length || 1;

    // レギュレーションラベル
    const gs = g.settings || {};
    const regLabel = gs.regN || gs.regMode === 'prime' ? regulationLabel(gs) : '';

    // チームカラーマップ（colorIdx基準）
    const teamColorMap = {};
    g.teams.forEach((t, i) => {
      const ci = t.colorIdx !== undefined ? t.colorIdx : i;
      teamColorMap[t.id] = COLORS[ci % COLORS.length];
    });

    // セット勝利数を集計
    const setWinsMap = {};
    g.teams.forEach(t => { setWinsMap[t.id] = 0; });
    setResults.forEach(sr => { if (sr.winnerId != null) setWinsMap[sr.winnerId] = (setWinsMap[sr.winnerId] || 0) + 1; });

    // ── サマリー行（チームごと：勝利セット数 + 各セット得点） ──
    const summaryRows = g.teams.map((t, ti) => {
      const isW = t.id === g.winnerId;
      const color = teamColorMap[t.id];
      const wins = setWinsMap[t.id] || 0;

      // 各セットのスコア
      const setScoreCells = setResults.map((sr, si) => {
        const sc = sr.scores ? sr.scores.find(s => s.teamId === t.id) : null;
        const score = sc ? sc.score : '-';
        const isSetWinner = sr.winnerId === t.id;
        return `<td style="text-align:center;font-size:12px;font-weight:${isSetWinner?'800':'500'};color:${isSetWinner?color:'#374151'};">
          ${isSetWinner ? '★' : ''}${score}${gs.regMode === 'uniform' && sc ? `<br><small>区間 ${score - (si ? (setResults[si-1].scores.find(p=>p.teamId===t.id)?.score || 0) : 0) >= 0 ? '+' : ''}${score - (si ? (setResults[si-1].scores.find(p=>p.teamId===t.id)?.score || 0) : 0)}</small>` : ''}
        </td>`;
      }).join('');

      return `<tr style="border-bottom:1px solid #f0f4f8;">
        <td style="padding:8px 10px;">
          <span style="display:inline-flex;align-items:center;gap:5px;">
            <span style="width:9px;height:9px;border-radius:50%;background:${color};display:inline-block;"></span>
            <span style="font-weight:700;font-size:13px;color:${color};">${escHtml(t.name)}</span>
            ${isW ? '<span style="font-size:10px;background:#FFF0E8;color:#FF5500;padding:1px 6px;border-radius:10px;font-weight:800;">勝者</span>' : ''}
          </span>
        </td>
        <td style="text-align:center;padding:8px 6px;font-size:14px;font-weight:800;color:${color};">${wins}勝</td>
        ${setScoreCells}
      </tr>`;
    }).join('');

    const setHeaders = setResults.map((_, si) =>
      `<th style="text-align:center;font-size:11px;color:#6b7280;padding:5px 6px;">S${si+1}</th>`
    ).join('');

    // ── 詳細（投擲チップ）セクション ──
    let detailHtml = '';
    if (isExpanded && setResults.length > 0) {
      detailHtml = setResults.map((sr, si) => {
        const scores = sr.scores || [];
        // 各チームの投擲配列を取得
        const teamThrows = scores.map(sc => ({
          sc,
          t: g.teams.find(t2 => t2.id === sc.teamId),
          throws: sc.throws || [],
          color: (g.teams.find(t2 => t2.id === sc.teamId)
            ? teamColorMap[g.teams.find(t2 => t2.id === sc.teamId).id]
            : '#888'),
          name: sc.teamName || (g.teams.find(t2 => t2.id === sc.teamId)
            ? g.teams.find(t2 => t2.id === sc.teamId).name
            : `チーム${sc.teamId+1}`)
        }));

        // 最大投擲数
        const maxThrows = Math.max(...teamThrows.map(tt => tt.throws.length), 0);

        // ヘッダー行：チーム名＋合計点
        const headerCols = teamThrows.map(tt => {
          const isSetW = sr.winnerId === tt.sc.teamId;
          return `<th style="text-align:center;padding:5px 6px;font-size:11px;font-weight:800;color:${tt.color};">
            ${isSetW ? '★' : ''}${escHtml(tt.name)}<br>
            <span style="font-size:10px;font-weight:500;color:#6b7280;">${tt.sc.score}点</span>
          </th>`;
        }).join('');

        // ターン行
        const turnRows = Array.from({length: maxThrows}, (_, ti) => {
          const cells = teamThrows.map(tt => {
            const h = tt.throws[ti];
            if (!h) return `<td style="text-align:center;padding:5px 6px;"><span style="color:#d1d5db;font-size:11px;">—</span></td>`;
            let chip;
            if (h.points === 0) {
              chip = `<span style="display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:800;background:#FEE2E2;color:#DC2626;">ミス</span>`;
            } else if (h.burst) {
              chip = `<span style="display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:800;background:#FEF3C7;color:#B45309;">${h.points}→25</span>`;
            } else {
              chip = `<span style="display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:800;background:${tt.color}18;color:${tt.color};border:1.5px solid ${tt.color}44;">${h.points}</span>`;
            }
            return `<td style="text-align:center;padding:4px 6px;">${chip}</td>`;
          }).join('');
          return `<tr style="border-bottom:1px solid #f8fafc;">
            <td style="text-align:center;padding:4px 6px;font-size:11px;color:#9ca3af;font-weight:600;">${ti+1}</td>
            ${cells}
          </tr>`;
        }).join('');

        return `<div style="padding:10px 12px;border-top:1px solid #f0f4f8;overflow-x:auto;">
          <div style="font-size:11px;font-weight:800;color:#6b7280;margin-bottom:6px;">セット ${si+1}</div>
          <table style="width:100%;border-collapse:collapse;min-width:200px;">
            <thead><tr style="background:#f8fafc;">
              <th style="text-align:center;padding:5px 6px;font-size:11px;color:#9ca3af;font-weight:600;">投</th>
              ${headerCols}
            </tr></thead>
            <tbody>${turnRows || '<tr><td colspan="99" style="text-align:center;color:#9ca3af;font-size:11px;padding:8px;">投擲データなし</td></tr>'}</tbody>
          </table>
        </div>`;
      }).join('');
    }

    return `
      <div class="card" style="margin-bottom:10px;">
        <div class="card-header" style="padding:10px 12px;">
          <div style="flex:1;">
            <div style="font-weight:700;font-size:14px;">${escHtml(g.gameName || `試合 #${S.history.length - gi}`)}</div>
            <div style="font-size:11px;color:#6b7280;margin-top:2px;">${dtStr}${dur ? ' · ' + dur : ''} · ${totalSets}セット${regLabel ? ' · <span style="color:#FF5500;font-weight:700;">' + regLabel + '</span>' : ''}</div>
          </div>
          ${winner ? `<div style="font-size:12px;font-weight:700;color:#FF5500;">🏆 ${escHtml(winner.name)}</div>` : ''}
        </div>
        <div style="padding:0;">
          <table style="width:100%;border-collapse:collapse;">
            <thead><tr style="background:#f8fafc;">
              <th style="text-align:left;padding:5px 10px;font-size:11px;color:#6b7280;">チーム</th>
              <th style="text-align:center;padding:5px 6px;font-size:11px;color:#6b7280;">勝利</th>
              ${setHeaders}
            </tr></thead>
            <tbody>${summaryRows}</tbody>
          </table>
        </div>
        ${detailHtml}
        <div class="card-body">${sheetActionButton('スコアシート・画像保存',gi)}</div>
        <div style="padding:8px 12px;border-top:1px solid #f0f4f8;text-align:center;">
          <button class="btn btn-gray btn-xs" onclick="toggleHistoryDetail(${gameId})">
            ${isExpanded ? '▲ 詳細を閉じる' : '▼ 投擲詳細を見る'}
          </button>
        </div>
      </div>`;
  }).join('');

  return `
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px;">
      <button class="btn btn-gray btn-xs" onclick="confirmClearHistory()">履歴を削除</button>
    </div>
    ${cards}
  `;
}

// ═══════════════════════════════════════════════════════════════
// イベントバインド
// ═══════════════════════════════════════════════════════════════
// 再描画の前と入力時に、設定フォームの値を状態へ退避する。
function captureSetupInputs() {
  if (stream?.active && !stream.canEdit()) return;
  if (S.phase !== 'setup') return;
  const gameName = document.getElementById('game-name');
  if (!gameName) return;
  S.settings.gameName = gameName.value;
  ensureSetupTeams();
  for (let i = 0; i < S.settings.teamCount; i++) {
    const input = document.getElementById(`team-name-${i}`);
    if (!input) continue;
    S.teams[i].name = input.value;
  }
  document.querySelectorAll('[data-member-team]').forEach(input => {
    const m=S.teams[Number(input.dataset.memberTeam)]?.members?.find(m=>m.id===Number(input.dataset.memberId));
    if(m)m.name=input.value;
  });
  const regulation = document.getElementById('reg-value');
  if (regulation) {
    const value = normalizedRegValue(regulation.value, S.settings.regMode);
    if (uniformMode()) { S.settings.targetScore = value; S.settings.regN = value / 50; }
    else S.settings.regN = value;
  }
  const target = document.getElementById('target-score');
  const misses = document.getElementById('max-miss');
  if (target && !uniformMode()) S.settings.targetScore = Math.max(10, parseInt(target.value) || 50);
  if (misses) S.settings.maxMiss = Math.max(1, parseInt(misses.value) || 3);
  enforceRegulationSettings();
  saveState();
  broadcastState();
}

function bindEvents() {
  if (S.phase !== 'setup') return;
  document.querySelectorAll('#app input').forEach(input => {
    input.addEventListener('input', captureSetupInputs);
  });
}

function switchTab(tab) {
  captureSetupInputs();
  _sheetOpen=false; _scoreEdit=null;
  _tab = tab;
  render();
}

function updateTeamCount(val) {
  if (stream?.active && !stream.canEdit()) return;
  captureSetupInputs();
  S.settings.teamCount = S.settings.regMode === 'prime' ? 2 : parseInt(val);
  ensureSetupTeams();
  saveState();
  render();
}

function moveSetupTeam(from, to) {
  if (stream?.active && !stream.canEdit()) return;
  captureSetupInputs();
  if (to < 0 || to >= S.teams.length || from < 0 || from >= S.teams.length) return;
  const team = S.teams.splice(from, 1)[0];
  S.teams.splice(to, 0, team);
  saveState(); render();
}

function clearSetupField(field) {
  if (stream?.active && !stream.canEdit()) return;
  captureSetupInputs();
  if (field === 'game') {
    S.settings.gameName = '';
    try { localStorage.setItem('molkky_game_name_v3', ''); } catch(e) {}
  } else if (S.teams[field]) {
    S.teams[field].name = '';
  }
  saveState(); render();
}

function normalizedRegValue(value, mode) {
  if (mode === 'eleven') return 11;
  if (mode === 'prime') return 4;
  const number = Number(value);
  const integer = Number.isFinite(number) ? Math.min(Number.MAX_SAFE_INTEGER, Math.floor(number)) : 1;
  return mode === 'uniform' ? Math.max(50, Math.floor(integer / 50) * 50) : Math.max(1, integer);
}

function normalizeRegInput(input) {
  captureSetupInputs();
  input.value = uniformMode() ? S.settings.targetScore : S.settings.regN;

}

function onStartGame() {
  captureSetupInputs();
  const tc = document.getElementById('target-score');
  const mc = document.getElementById('max-miss');
  if (tc && !uniformMode()) S.settings.targetScore = Math.max(10, parseInt(tc.value) || 50);
  if (mc) S.settings.maxMiss = Math.max(1, parseInt(mc.value) || 3);
  startGame();
}

function switchRegMode(mode) {
  if (stream?.active && !stream.canEdit()) return;
  captureSetupInputs();
  // モード切替時にデフォルトNを設定
  const defaults = { match: 2, first: 2, total: 2, uniform: 2, prime: 4, eleven: 11 };
  const wasUniform = uniformMode();
  if (mode === 'uniform') S.settings.targetScore = 100;
  else if (wasUniform) S.settings.targetScore = 50;
  S.settings.regMode = mode;
  S.settings.regN = defaults[mode];
  enforceRegulationSettings();
  ensureSetupTeams();
  saveState(); render();
}

function setUniformTarget(n) {
  if (stream?.active && !stream.canEdit()) return;
  captureSetupInputs();
  S.settings.regMode = 'uniform';
  S.settings.targetScore = normalizedRegValue(n, 'uniform');
  S.settings.regN = S.settings.targetScore / 50;
  saveState(); render();
}

function setRegulation(mode, n) {
  if (stream?.active && !stream.canEdit()) return;
  captureSetupInputs();
  S.settings.regMode = mode;
  S.settings.regN = normalizedRegValue(n, mode);
  enforceRegulationSettings();
  ensureSetupTeams();
  saveState(); render();
}

function onThrow(points) {
  applyThrow(S.currentTeamIdx, points);
}

function onUndo() {
  undoLastThrow();
}

function toggleIntended(teamIdx, histIdx) {
  if (stream?.active && !stream.canEdit()) return;
  const team = S.teams[teamIdx];
  if (!team || !team.history[histIdx]) return;
  team.history[histIdx].intended = !(team.history[histIdx].intended !== false);
  saveState();
  render();
}

function confirmReset() {
  showConfirm('試合をリセットしますか？\n現在の試合データは失われます。', () => {
    resetGame();
  });
}

function confirmEndGame() {
  showConfirm('試合を強制終了しますか？', () => {
    endGame(null);
  });
}

function confirmClearHistory() {
  if (stream?.active && !stream.canEdit()) return;
  showConfirm('履歴をすべて削除しますか？', () => {
    S.history = [];
    saveState();
    render();
  });
}

function copyOverlayUrl() {
  const input = document.getElementById('overlay-url-input');
  if (!input) return;
  navigator.clipboard.writeText(input.value).then(() => {
    const btn = document.getElementById('copy-overlay-btn');
    if (btn) {
      btn.textContent = '✓ コピー済';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('copied'); }, 2000);
    }
  }).catch(() => {
    input.select();
    document.execCommand('copy');
  });
}

// ─── モーダル ────────────────────────────────────────────────────
let _confirmCallback = null;

function showConfirm(msg, cb) {
  document.getElementById('modal-confirm-body').textContent = msg;
  _confirmCallback = cb;
  document.getElementById('modal-confirm').classList.add('open');
  document.getElementById('modal-confirm-ok').onclick = () => {
    closeModal('modal-confirm');
    if (_confirmCallback) _confirmCallback();
  };
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

// 委譲したイベントでタッチ・マウス・キーボードに同じ押下反応を付ける。
// ハイライトはappの外へ描画し、得点入力による再描画中も短く残す。
function installButtonFeedback() {
  let pressed=null;
  let pointerStart=null;
  function control(target) {
    const el=target?.closest?.('button,.tab');
    return el&&!el.disabled&&el.getAttribute('aria-disabled')!=='true'?el:null;
  }
  function release() {
    pressed?.classList.remove('is-pressed');pressed=null;pointerStart=null;
  }
  document.addEventListener('pointerdown',event=>{
    if(!event.isPrimary||event.button!==0)return;
    release();pressed=control(event.target);
    if(pressed){pressed.classList.add('is-pressed');pointerStart={x:event.clientX,y:event.clientY};}
  },{passive:true});
  document.addEventListener('pointermove',event=>{
    if(pointerStart&&Math.hypot(event.clientX-pointerStart.x,event.clientY-pointerStart.y)>12)release();
  },{passive:true});
  document.addEventListener('pointerup',release,{passive:true});
  document.addEventListener('pointercancel',release,{passive:true});
  window.addEventListener('blur',release);
  document.addEventListener('keydown',event=>{
    if(event.key!==' '&&event.key!=='Enter')return;
    const el=control(event.target);if(el){release();pressed=el;el.classList.add('is-pressed');}
  });
  document.addEventListener('keyup',event=>{if(event.key===' '||event.key==='Enter')release();});
  document.addEventListener('click',event=>{
    const el=control(event.target);if(!el)return;
    release();
    const rect=el.getBoundingClientRect();if(!rect.width||!rect.height)return;
    const flash=document.createElement('span');flash.className='button-tap-flash';flash.setAttribute('aria-hidden','true');
    Object.assign(flash.style,{left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',borderRadius:getComputedStyle(el).borderRadius});
    document.body.appendChild(flash);
    flash.addEventListener('animationend',()=>flash.remove(),{once:true});
    setTimeout(()=>flash.remove(),400);
  },true);
}

// ─── ユーティリティ ──────────────────────────────────────────────
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════════════════
// 初期化
// ═══════════════════════════════════════════════════════════════
if(typeof document.addEventListener==='function')installButtonFeedback();
if (stream?.active) {
  stream.getState = () => JSON.stringify(S);
  stream.onState = state => { S=state; _orderDraft=null; _scoreEdit=null; render(); };
  stream.onStatus = updateStreamControls;
  void stream.start();
}

function openOperationsMenu() {
  const dialog=document.getElementById('operations-menu');if(!dialog)return;
  captureSetupInputs();updateOperationsMenu();
  _operationsOpen=true;document.getElementById('operations-toggle')?.setAttribute('aria-expanded','true');
  document.body.classList.add('operations-open');if(!dialog.open)dialog.showModal();
}
function closeOperationsMenu(){document.getElementById('operations-menu')?.close();}
function operationsMenuClosed(){_operationsOpen=false;document.body.classList.remove('operations-open');const toggle=document.getElementById('operations-toggle');toggle?.setAttribute('aria-expanded','false');toggle?.focus();}
function updateOperationsMenu() {
  const menu=document.getElementById('operations-content');if(!menu)return;
  const focused=document.activeElement?.id;menu.replaceChildren();
  const context=document.createElement('p');context.className='operations-context';
  context.textContent=stream?.active?stream.message:'この画面の試合は、この端末に保存します。配信する場合は管理者メニューで入力リンクを発行して開いてください。';menu.append(context);
  const button=(text,action,fn)=>{const b=document.createElement('button');b.id='operation-'+action;b.className='operations-action';b.textContent=text;b.onclick=async()=>{b.disabled=true;try{await fn();closeOperationsMenu();}catch(e){alert(e.message==='UNSENT_RECORDS'?'未同期の記録があります。接続と同期が完了してから操作してください。':'操作できませんでした。接続や入力担当を確認してください。');}finally{updateStreamControls();}};menu.append(b);};
  if(stream?.active){
    if(stream.ready&&!stream.lastError&&!stream.info?.hasOwner&&!stream.hasPending())button('この端末で入力する','claim',()=>stream.action('claim'));
    if(stream.ready&&!stream.lastError&&stream.info?.hasOwner&&!stream.info.isOwner)button(stream.info.transfer?.isRequester?'交代申請を取り消す':'入力交代を申請','request',()=>stream.action(stream.info.transfer?.isRequester?'cancel':'request'));
    if(stream.info?.isOwner&&stream.info.transfer&&!stream.info.transfer.isRequester){button('交代を承認する','approve',()=>stream.action('approve'));button('申請を断る','cancel',()=>stream.action('cancel'));}
    if(stream.hasPending()||stream.storageFailed){
      button('未反映の記録を出力','export',()=>stream.download());
      if(stream.locked)button('サーバー保存済みの記録に戻る','restore',async()=>{if(confirm('未反映の記録を先に出力して保管してください。この端末の未送信分を取り除き、サーバー保存済みの記録を表示しますか？'))await stream.discardLocal();});
    }
  }
  if(S.phase==='setup'&&(!stream?.active||stream.canEdit()))button('試合設定を初期化','reset-settings',confirmResetSettings);
  const admin=document.createElement('a');admin.id='operation-admin';admin.className='operations-action primary';admin.href='https://so-molkky-score-api.sou-underscore.workers.dev/';admin.textContent='管理者メニュー';menu.append(admin);
  menu.insertAdjacentHTML('beforeend',buildOverlayInfo());
  if(focused&&document.getElementById('operations-menu')?.open)document.getElementById(focused)?.focus();
}
function updateStreamControls() {
  const box=document.getElementById('stream-status'),role=document.getElementById('input-role');if(!box)return;
  box.replaceChildren();box.hidden=true;
  if(role){role.textContent=stream?.active?(stream.storageFailed?'保存エラー':!stream.ready?'接続確認中':stream.canEdit()?'入力中':stream.info?.isOwner?'入力停止':'閲覧のみ'):'端末内';role.classList.toggle('is-owner',!!stream?.active&&stream.canEdit());}
  updateOperationsMenu();if(!stream?.active)return;
  const pending=stream.hasPending(),attention=stream.storageFailed||!!stream.lastError;
  const request=stream.info?.isOwner&&stream.info.transfer&&!stream.info.transfer.isRequester;
  const button=(text,fn)=>{const b=document.createElement('button');b.className='btn btn-sm';b.textContent=text;b.onclick=async()=>{b.disabled=true;try{await fn();}finally{updateStreamControls();}};box.append(b);};
  if(attention||request){
    box.hidden=false;const text=document.createElement('span');text.textContent=attention?(stream.storageFailed?'端末に保存できません。記録を出力してください。':pending?'未同期の記録があります。':stream.message):'入力交代の申請が届いています。';box.append(text);
    if(pending&&!stream.storageFailed)button('再接続',()=>stream.refresh());
    if(request||pending||stream.storageFailed)button('確認',openOperationsMenu);
  }
  const readonly=!stream.canEdit()||_streamTransition;
  document.querySelectorAll('#app input,#app select').forEach(el=>el.disabled=readonly);
  document.querySelectorAll('#app button').forEach(el=>{
    if(box.contains(el)||el.hasAttribute('data-stream-control'))return;
    const action=el.getAttribute('onclick')||'';
    const view=/^(switchTab|openScoresheet|closeScoresheet|openSheet|closeModal|saveScoresheet|showScoresheet|navigateSheet|changeSheet|copyOverlayUrl|toggleThrowTimer|resetThrowTimer)/.test(action);
    if(readonly&&!view){el.disabled=true;el.dataset.streamDisabled='1';}
    else if(el.dataset.streamDisabled){el.disabled=false;delete el.dataset.streamDisabled;}
  });
}

async function managedNewMatch(change) {
  if(!stream.canEdit()||_streamTransition)return;
  _streamTransition=true;updateStreamControls();
  await stream.flush();
  if(stream.hasPending()||stream.offline||stream.busy){_streamTransition=false;updateStreamControls();alert('次の試合は、接続と同期が完了してから開始してください。');return;}
  const before=JSON.stringify(S);let next,view;
  _streamTransition=true;
  try { change();next=JSON.parse(JSON.stringify(S));view=getPublicState(); }
  catch(e){S=JSON.parse(before);_streamTransition=false;render();throw e;}
  S=JSON.parse(before);render();
  try{await stream.newMatch(next,view,JSON.parse(before).phase==='setup'&&next.phase==='playing');S=next;}
  catch{S=next;alert('新しい試合の保存を確認できませんでした。接続・同期を確認してください。');}
  finally{_streamTransition=false;saveState();render();}
}

render();
</script>
